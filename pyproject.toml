[project]
name = "stagetimer"
version = "0.1.0"
description = "Fullscreen event countdown timer for Raspberry Pi 5"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
stagetimer = ["assets/*.png", "assets/fonts/*.ttf"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
